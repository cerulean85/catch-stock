<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>영웅문S# 앱으로 이동 중...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn-primary {
      background-color: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.4);
    }
    .btn-primary:active { background-color: #1d4ed8; }
    .btn-secondary {
      background-color: #334155;
      color: #cbd5e1;
      font-size: 14px;
      padding: 12px;
    }
    .btn-secondary:active { background-color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚀</div>
    <h1>영웅문S# 실행 중...</h1>
    <p>화면에 <strong>'영웅문S#에서 여시겠습니까?'</strong> 창이 뜨면 <strong>[열기]</strong>를 눌러주세요.<br>자동으로 열리지 않으면 아래 버튼을 눌러주세요.</p>

    <a id="app-btn" href="heromts://" class="btn btn-primary">영웅문S# 앱 열기</a>
    <a id="store-btn" href="https://apps.apple.com/kr/app/id1589718424" class="btn btn-secondary" style="display:none;">App Store에서 보기</a>
    <a id="play-btn" href="https://play.google.com/store/apps/details?id=com.kiwoom.herous.ma" class="btn btn-secondary" style="display:none;">Google Play에서 보기</a>
    <a href="https://m.kiwoom.com" class="btn btn-secondary" style="font-size:12px; opacity:0.8;">키움 모바일 웹으로 이동</a>
  </div>

  <script>
    (function() {
      var ua = navigator.userAgent.toLowerCase();
      var isAndroid = /android/.test(ua);
      var isIOS = /iphone|ipad|ipod/.test(ua);

      if (isAndroid) {
        document.getElementById('app-btn').href = "intent://#Intent;scheme=heromts;package=com.kiwoom.heromts;end";
        document.getElementById('play-btn').style.display = 'block';
        window.location.href = "intent://#Intent;scheme=heromts;package=com.kiwoom.heromts;end";
      } else if (isIOS) {
        document.getElementById('store-btn').style.display = 'block';
        window.location.href = "heromts://";
      } else {
        window.location.href = "heromts://";
      }
    })();
  </script>
</body>
</html>
